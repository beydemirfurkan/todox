# Cutting a release, without an npm account.
#
#   git tag v0.1.2 && git push origin v0.1.2
#
# That is the whole procedure. This builds the stdio package and attaches it to
# a GitHub Release, which is the entire distribution — there is deliberately no
# npm publish. `npx <tarball url>` needs no account, no token and no decision,
# and a release step that can only run once somebody has created a credential
# is a release step that does not run.
#
# Two names go up, and the second is the reason this is not just a copy:
#
#   todox-mcp-<version>.tgz   pins a version, and is what an MCP config should
#                             point at if you want to choose when to move
#   todox-mcp.tgz             same bytes under a stable name, so
#                             /releases/latest/download/todox-mcp.tgz always
#                             resolves to the newest release
#
# Without npm, that second URL is the closest thing there is to `npx todox-mcp`,
# and a documented address that never goes stale is worth three lines here.
name: release

on:
  push:
    tags: ["v*"]

# `contents: write` to create the Release. Nothing else is published, so
# nothing else needs a permission.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The tag is the claim; package.json is the fact. `server-json.test.ts`
      # already pins the MCP registry entry to the same number, so all three
      # move together or the tag is wrong — and a release whose tag disagrees
      # with what it publishes is the kind of thing nobody notices until they
      # are trying to work out which version is live.
      - name: the tag and the version agree
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $GITHUB_REF_NAME says $tag, package.json says $pkg" >&2
            exit 1
          fi
          echo "releasing $pkg"
          echo "version=$pkg" >> "$GITHUB_OUTPUT"

      # Not a shortcut around CI: this is a tag, so nothing has necessarily run
      # against this exact tree. The pack step itself also fails if anything
      # server-side has reached the stdio surface.
      - run: pnpm lint
      - run: pnpm test
      # `pnpm build` before `tsc`, and not for the build's own sake: PageProps
      # and LayoutProps are globals Next generates into .next/types, so a
      # typecheck without one fails on every page in app/. ci.yml already runs
      # them in this order; this job did not, and a tag is the only thing that
      # runs it — so the first tag is where that showed.
      - run: pnpm build
      - run: pnpm exec tsc --noEmit
      - run: pnpm pack:mcp

      - name: build the tarball, under both names
        run: |
          cd dist-npm
          npm pack
          # A byte-identical copy under a name with no version in it. That is
          # what makes /releases/latest/download/todox-mcp.tgz a URL somebody
          # can put in an MCP config once and never revisit; the versioned name
          # stays for anybody who would rather pin.
          cp "todox-mcp-${{ steps.version.outputs.version }}.tgz" todox-mcp.tgz
          ls -l ./*.tgz

      # Unconditional, and the reason this workflow is useful with no secrets at
      # all: the tarball is a URL `npx` accepts.
      - name: attach it to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-npm/*.tgz
          generate_release_notes: true
          body: |
            Install the stdio MCP server without cloning anything. There is no
            npm package; these URLs are the distribution.

            ```bash
            # always the newest release
            npx https://github.com/${{ github.repository }}/releases/latest/download/todox-mcp.tgz

            # or pin this one
            npx https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/todox-mcp-${{ steps.version.outputs.version }}.tgz
            ```

            The hosted server needs none of this — point any MCP client at
            https://www.todox.dev/api/mcp with a token. The local package exists
            for the one thing a remote server cannot do, which is read your disk.

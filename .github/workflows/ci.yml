name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # version comes from packageManager in package.json; passing it here
      # too makes the action fail on the conflict.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

      # Unit tests, so they run whether or not a database secret is configured.
      # The smoke suites below need one and are usually skipped; these cover the
      # logic that has no database in it -- SQL column allow-lists, RPC param
      # validation, report windows and duration replay.
      - run: pnpm test

      # Build first: PageProps and LayoutProps are globals Next generates into
      # .next/types, so a bare tsc run before it cannot resolve them.
      # Nothing queries the database at build time -- every page is
      # force-dynamic -- which is what keeps this job free of secrets.
      - run: pnpm build

      # Covers what the build does not: scripts/ and mcp/.
      - run: pnpm exec tsc --noEmit

      - run: pnpm audit --prod

  # Path handling is the one place this codebase is platform-specific, and the
  # machine it runs on is almost never the machine the paths come from. A
  # Windows agent could not register its own project for a while, and every
  # check above was green throughout.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # DIAGNOSTIC, on a throwaway branch — never merge this job.
  #
  # The comment below asserts why `smoke` is off, and nobody has checked since
  # 2026-08-11. This asks the secret itself. Read-only on purpose: `smoke`
  # writes and deletes rows, and until we know whether this string still points
  # at the throwaway branch or at something else, nothing may run that does.
  # Only the role and database names are printed, never the connection string.
  #
  # It is worth confirming rather than assuming: `smoke` is the only job that
  # starts the stdio process, and while it was off a bug shipped that killed
  # every local MCP session at startup (fixed in ec765c8). `check` and
  # `windows` were green the whole time.
  whoami:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: The secret is not even set
        if: env.DATABASE_URL == ''
        run: |
          echo "::error::DATABASE_URL is empty — nothing to diagnose."
          exit 1

      - name: Which role and database does it authenticate as
        if: env.DATABASE_URL != ''
        run: |
          psql "$DATABASE_URL" -Atc \
            "select 'CONNECTED role=' || current_user || ' db=' || current_database()"

  # TEMP-DISABLED: The DATABASE_URL secret stopped authenticating as 'todox_ci'
  # on 2026-08-11 — Neon rotated the password, the connection string in repo
  # settings was not updated. `check` and `windows` still run; only the
  # database-requiring smoke suites are off. Re-enable by removing `if: false`
  # once a fresh connection string from Neon is set as the DATABASE_URL repo
  # secret.
  smoke:
    if: false
    runs-on: ubuntu-latest
    needs: check
    # `secrets` is not available in an `if:` expression, so it is mapped to the
    # environment first and the steps test that instead.
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v7
      # version comes from packageManager in package.json; passing it here
      # too makes the action fail on the conflict.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: No database configured
        if: env.DATABASE_URL == ''
        run: echo "Set a DATABASE_URL secret (a throwaway branch) to run these."

      - name: Migrate
        if: env.DATABASE_URL != ''
        run: pnpm db:migrate

      - name: Auth guarantees
        if: env.DATABASE_URL != ''
        run: pnpm smoke:auth

      - name: Report arithmetic
        if: env.DATABASE_URL != ''
        run: pnpm smoke:report

      # Invite, accept, attribution, removal, and the notice each one owes
      # somebody. Every assertion here is about a row two accounts share, which
      # is the part no unit test can stand in for.
      - name: Collaboration guarantees
        if: env.DATABASE_URL != ''
        run: pnpm smoke:collab

      # The suite that keeps mcp/tools.ts honest as one definition: it runs the
      # same assertions through the hosted endpoint and the stdio process, and
      # a tool that only works one way in fails here. It needs the app running,
      # which is why it is last.
      - name: Agent surface, both transports
        if: env.DATABASE_URL != ''
        run: |
          pnpm build
          pnpm start &
          npx --yes wait-on http://localhost:3000/login --timeout 60000
          pnpm smoke:mcp

name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # version comes from packageManager in package.json; passing it here
      # too makes the action fail on the conflict.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

      # The domain rules live in both AGENTS.md and CONTRIBUTING.md on purpose:
      # Codex and Cursor read the first directly and will not follow a
      # reference to the second. They had already drifted, guarded only by a
      # checkbox in the PR template, which is a thing that cannot notice.
      - run: pnpm check:docs

      # Unit tests, which need no database of their own -- SQL column
      # allow-lists, RPC param validation, report windows, duration replay.
      # The smoke job below brings up its own Postgres for the rest.
      - run: pnpm test

      # Build first: PageProps and LayoutProps are globals Next generates into
      # .next/types, so a bare tsc run before it cannot resolve them.
      # Nothing queries the database at build time -- every page is
      # force-dynamic -- which is what keeps this job free of secrets.
      - run: pnpm build

      # Covers what the build does not: scripts/ and mcp/.
      - run: pnpm exec tsc --noEmit

      - run: pnpm audit --prod

  # Path handling is the one place this codebase is platform-specific, and the
  # machine it runs on is almost never the machine the paths come from. A
  # Windows agent could not register its own project for a while, and every
  # check above was green throughout.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # The suites that need a database, against one this job starts itself.
  #
  # They used to need a hosted branch reachable through a repo secret, and were
  # skipped from 2026-08-11 to 2026-08-15 because that credential was rotated
  # and the secret was never updated. A container has no such failure: nothing
  # to provision, nothing to expire, no state shared between runs, and no way
  # to point at production by accident.
  #
  # Worth the care, because this is the only job that starts the stdio MCP
  # process. A bug that killed every local session at startup shipped during
  # that window, with `check` and `windows` green throughout.
  smoke:
    runs-on: ubuntu-latest
    needs: check

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: todox
          POSTGRES_PASSWORD: todox
          POSTGRES_DB: todox
        ports:
          - 5432:5432
        # Without the health check the steps start before Postgres is accepting
        # connections, and the failure reads as a broken migration.
        options: >-
          --health-cmd "pg_isready -U todox"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://todox:todox@localhost:5432/todox
      TODOX_PUBLIC_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v7
      # version comes from packageManager in package.json; passing it here
      # too makes the action fail on the conflict.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Migrate
        run: pnpm db:migrate

      - name: Auth guarantees
        run: pnpm smoke:auth

      # Seeded first: this suite checks report arithmetic against the demo
      # account, which a fresh database does not have. It says so rather than
      # guessing, which on a container is every run.
      - name: Report arithmetic
        run: |
          pnpm seed
          pnpm smoke:report

      # Invite, accept, attribution, removal, and the notice each one owes
      # somebody. Every assertion here is about a row two accounts share, which
      # is the part no unit test can stand in for.
      - name: Collaboration guarantees
        run: pnpm smoke:collab

      # The suite that keeps mcp/tools.ts honest as one definition: it runs the
      # same assertions through the hosted endpoint and the stdio process, and
      # a tool that only works one way in fails here. It needs the app running,
      # which is why it is last.
      - name: Agent surface, both transports
        run: |
          pnpm build
          pnpm start &
          npx --yes wait-on http://localhost:3000/login --timeout 60000
          pnpm smoke:mcp

name: ci

on:
  push:
    branches: [main]
  pull_request:

# A stray second run on the same branch wastes minutes and tells you nothing.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      # Every page is force-dynamic, so nothing queries the database at build
      # time. That is what keeps this job free of secrets.
      - name: Build
        run: pnpm build

  # The smoke suites need a real Postgres, so they are opt-in: add a
  # DATABASE_URL secret pointing at a throwaway branch and they start running.
  smoke:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Skip without a database
        if: ${{ !secrets.DATABASE_URL }}
        run: echo "No DATABASE_URL secret set — skipping the database checks."

      - name: Migrate
        if: ${{ secrets.DATABASE_URL }}
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Auth guarantees
        if: ${{ secrets.DATABASE_URL }}
        run: pnpm smoke:auth
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

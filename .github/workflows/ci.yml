name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # version comes from packageManager in package.json; passing it here
      # too makes the action fail on the conflict.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

      # Unit tests, so they run whether or not a database secret is configured.
      # The smoke suites below need one and are usually skipped; these cover the
      # logic that has no database in it -- SQL column allow-lists, RPC param
      # validation, report windows and duration replay.
      - run: pnpm test

      # Build first: PageProps and LayoutProps are globals Next generates into
      # .next/types, so a bare tsc run before it cannot resolve them.
      # Nothing queries the database at build time -- every page is
      # force-dynamic -- which is what keeps this job free of secrets.
      - run: pnpm build

      # Covers what the build does not: scripts/ and mcp/.
      - run: pnpm exec tsc --noEmit

      - run: pnpm audit --prod

  # Path handling is the one place this codebase is platform-specific, and the
  # machine it runs on is almost never the machine the paths come from. A
  # Windows agent could not register its own project for a while, and every
  # check above was green throughout.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # The suites that need a database. They were off between 2026-08-11 and
  # 2026-08-15, after Neon rotated the password and the repo secret was not
  # updated. That gap is the argument for the two guards below: this is the only
  # job that starts the stdio MCP process, and while it was skipped a bug
  # shipped that killed every local session at startup. `check` and `windows`
  # were green throughout, so nothing else was ever going to catch it.
  smoke:
    runs-on: ubuntu-latest
    needs: check
    # `secrets` is not available in an `if:` expression, so it is mapped to the
    # environment first and the steps test that instead.
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v7
      # version comes from packageManager in package.json; passing it here
      # too makes the action fail on the conflict.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Fails rather than reports. This step used to echo a note and let the job
      # finish green, which is exactly how four days of no database coverage
      # looked identical to four days of passing coverage.
      - name: No database configured
        if: env.DATABASE_URL == ''
        run: |
          echo "::error::DATABASE_URL is not set, so none of the suites below" \
               "would run. Set it to a THROWAWAY Neon branch — never the one" \
               "in PROD_DATABASE_URL; everything here writes and deletes rows."
          exit 1

      # Everything after this point writes and deletes rows, so it has to be
      # certain of what it is connected to first.
      #
      # The role is the check, not the host: `todox_ci` exists only on the
      # throwaway branch, and production runs as its own owner. Comparing
      # against PROD_DATABASE_URL instead would mean putting that secret in
      # this job's environment, and the whole point of keeping them separate is
      # that the suites can never reach it.
      - name: Refuse to run against anything but the CI database
        if: env.DATABASE_URL != ''
        run: |
          role=$(psql "$DATABASE_URL" -Atc "select current_user")
          echo "connected as: $role"
          if [ "$role" != "todox_ci" ]; then
            echo "::error::Connected as '$role', not 'todox_ci'. Refusing to" \
                 "run suites that delete rows against a database this job was" \
                 "not meant to touch."
            exit 1
          fi

      - name: Migrate
        if: env.DATABASE_URL != ''
        run: pnpm db:migrate

      - name: Auth guarantees
        if: env.DATABASE_URL != ''
        run: pnpm smoke:auth

      - name: Report arithmetic
        if: env.DATABASE_URL != ''
        run: pnpm smoke:report

      # Invite, accept, attribution, removal, and the notice each one owes
      # somebody. Every assertion here is about a row two accounts share, which
      # is the part no unit test can stand in for.
      - name: Collaboration guarantees
        if: env.DATABASE_URL != ''
        run: pnpm smoke:collab

      # The suite that keeps mcp/tools.ts honest as one definition: it runs the
      # same assertions through the hosted endpoint and the stdio process, and
      # a tool that only works one way in fails here. It needs the app running,
      # which is why it is last.
      - name: Agent surface, both transports
        if: env.DATABASE_URL != ''
        run: |
          pnpm build
          pnpm start &
          npx --yes wait-on http://localhost:3000/login --timeout 60000
          pnpm smoke:mcp

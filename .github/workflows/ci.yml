name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # version comes from packageManager in package.json; passing it here
      # too makes the action fail on the conflict.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      # Every page is force-dynamic, so nothing queries the database at build
      # time. That is what keeps this job free of secrets.
      - run: pnpm build

  smoke:
    runs-on: ubuntu-latest
    needs: check
    # `secrets` is not available in an `if:` expression, so it is mapped to the
    # environment first and the steps test that instead.
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      # version comes from packageManager in package.json; passing it here
      # too makes the action fail on the conflict.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: No database configured
        if: env.DATABASE_URL == ''
        run: echo "Set a DATABASE_URL secret (a throwaway branch) to run these."

      - name: Migrate
        if: env.DATABASE_URL != ''
        run: pnpm db:migrate

      - name: Auth guarantees
        if: env.DATABASE_URL != ''
        run: pnpm smoke:auth

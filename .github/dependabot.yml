version: 2
updates:
  # Weekly rather than daily: this is a small dependency list — seven runtime
  # packages — and a pull request per patch bump is noise nobody reads.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      types:
        patterns: ["@types/*"]
      dev:
        dependency-type: development
    ignore:
      # typescript-eslint refuses to load against TS 7 and eslint-config-next
      # pulls it in, so `pnpm lint` dies before it reads a line of source. The
      # first grouped dev bump proved it. Neither major is worth taking until
      # that support lands; patches and minors still come through.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: eslint
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
